[project]
name = "mafia-agents"
version = "0.1.0"
description = "Foundational contracts and engine skeleton for a Mafia RL environment."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "elevenlabs>=2.39,<3.0",
  "pydantic>=2.11,<3.0",
  "pydantic-ai-slim[openrouter]",
  "PyYAML>=6.0,<7.0",
  "torch>=2.6,<3.0",
  "transformers>=4.51,<5.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval", "src/game", "src/policies", "src/train"]
include = ["src/contracts.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
